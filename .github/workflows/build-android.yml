name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install Dependencies
      run: |
        cd mobile
        npm install
        
    - name: Add Android Platform
      run: |
        cd mobile
        npx cap add android || true
        
    - name: Sync Android
      run: |
        cd mobile
        npx cap sync android
        
    - name: Add Permissions to AndroidManifest
      run: |
        MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
        # Agregar permisos antes de <application
        sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
        cat "$MANIFEST"
        
    - name: Build APK
      run: |
        cd mobile/android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mi-app-android
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

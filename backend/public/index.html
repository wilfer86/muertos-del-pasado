<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muertos del Pasado</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body class="web-bg">
  <div class="overlay"></div>
  
  <div class="container">
    <header>
      <img src="img/logo.png" alt="Logo" class="logo">
      <h1>MUERTOS DEL PASADO</h1>
      <p class="subtitle">Arqueología de señales de radio muertas</p>
    </header>
    
    <div class="controls">
      <button id="startBtn" class="btn-primary">INICIAR CAPTURA</button>
      <button id="stopBtn" class="btn-secondary" disabled>DETENER</button>
    </div>
    
    <div class="spectrogram-container">
      <canvas id="spectrogram"></canvas>
      <div class="scan-line"></div>
    </div>
    
    <div id="status" class="status">
      <span class="status-icon"></span>
      <span class="status-text">Esperando...</span>
    </div>
    
    <div id="results" class="results"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

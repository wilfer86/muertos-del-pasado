<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muertos del Pasado</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <header>
      <h1> MUERTOS DEL PASADO</h1>
      <p class="subtitle">Arqueología de señales de radio muertas</p>
    </header>
    
    <div class="controls">
      <button id="startBtn" class="btn-primary">INICIAR CAPTURA</button>
      <button id="stopBtn" class="btn-secondary" disabled>DETENER</button>
    </div>
    
    <div class="spectrogram-container">
      <canvas id="spectrogram"></canvas>
    </div>
    
    <div id="status" class="status">Esperando...</div>
    
    <div id="results" class="results"></div>
  </div>

  <script src="js/apiClient.js"></script>
  <script src="js/spectrogram.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
